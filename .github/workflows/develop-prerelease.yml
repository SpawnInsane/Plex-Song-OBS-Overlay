name: Develop prerelease

on:
  push:
    branches: [develop]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: develop-prerelease
  cancel-in-progress: false

jobs:
  calculate:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.needed.outputs.publish }}
      new_tag: ${{ steps.version.outputs.new_tag }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
      release_name: ${{ steps.version.outputs.release_name }}
    steps:
      - name: Require a pull request merge into develop
        id: merged
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3 4 5; do
            COUNT="$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '[.[] | select(.merged_at != null and .base.ref == "develop")] | length')"
            if [ "$COUNT" -gt 0 ]; then echo "publish=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep 3
          done
          echo "publish=false" >> "$GITHUB_OUTPUT"
      - name: Check out merged revision
        if: steps.merged.outputs.publish == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prevent a duplicate prerelease
        if: steps.merged.outputs.publish == 'true'
        id: needed
        run: |
          EXISTING_TAG="$(git tag --points-at HEAD --list 'v*-rc.*' | head -n 1)"
          if [ -n "$EXISTING_TAG" ]; then echo "publish=false" >> "$GITHUB_OUTPUT"; else echo "publish=true" >> "$GITHUB_OUTPUT"; fi
      - name: Test version calculation
        if: steps.needed.outputs.publish == 'true'
        run: node .github/scripts/calculate-release-version.test.cjs
      - name: Calculate release candidate version
        if: steps.needed.outputs.publish == 'true'
        id: version
        run: node .github/scripts/calculate-release-version.cjs --channel=rc

  prepare:
    needs: calculate
    if: needs.calculate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - name: Check out merged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Update version metadata
        env:
          NEXT_TAG: ${{ needs.calculate.outputs.new_tag }}
        run: node -e 'const fs=require("fs"); fs.writeFileSync("version.json", JSON.stringify({version:process.env.NEXT_TAG}, null, 2)+"\n");'
      - name: Commit version metadata
        id: commit
        env:
          NEXT_TAG: ${{ needs.calculate.outputs.new_tag }}
        run: |
          if git diff --quiet -- version.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore: prepare ${NEXT_TAG} prerelease"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Push version metadata
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_SYNC_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::Configure RELEASE_SYNC_TOKEN with Contents read/write access."; exit 1; fi
          gh auth setup-git
          git push origin HEAD:develop

  release:
    needs: [calculate, prepare]
    if: needs.calculate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out versioned revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Run tests
        run: go test ./...
      - name: Build release artifact
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          mkdir dist
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o dist/PlexSongGrabber.exe .
          sha256sum dist/PlexSongGrabber.exe > dist/PlexSongGrabber.exe.sha256
      - name: Create prerelease
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          tag: ${{ needs.calculate.outputs.new_tag }}
          commit: ${{ needs.prepare.outputs.commit_sha }}
          name: ${{ needs.calculate.outputs.release_name }}
          bodyFile: body.md
          generateReleaseNotes: true
          generateReleaseNotesPreviousTag: ${{ needs.calculate.outputs.previous_tag }}
          artifacts: dist/*
          prerelease: true
          makeLatest: false
